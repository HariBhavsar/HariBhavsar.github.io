
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Curriculum vitae of Hari Bhavsar, computer architecture researcher.">
    <title>CV | Hari Bhavsar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --background: #ffffff;
            --surface: #f7f8fa;
            --text: #202938;
            --muted: #5c6675;
            --accent: #245b8f;
            --border: #e5e9ef;
            --max-width: 1000px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.75;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Navigation */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: var(--max-width);
            min-height: 68px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.4px;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--accent);
            text-decoration: none;
        }

        /* Page */

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 58px 28px 40px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 26px;
        }

        .page-header h1 {
            margin-bottom: 8px;
            font-size: clamp(28px, 4vw, 36px);
            line-height: 1.25;
            letter-spacing: -1px;
        }

        .page-header p {
            color: var(--muted);
            font-size: 15px;
        }

        .cv-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cv-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #ffffff;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .cv-button:hover {
            background: var(--surface);
            border-color: #cbd5e1;
            text-decoration: none;
        }

        .cv-button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .cv-button.primary:hover {
            background: #1d4b77;
        }

        .cv-button i {
            font-size: 13px;
        }

        /* PDF viewer */

        .pdf-frame {
            overflow: hidden;
            height: min(82vh, 1100px);
            min-height: 600px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }

        .pdf-frame iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .pdf-fallback {
            padding: 28px;
            color: var(--muted);
            text-align: center;
        }

        .pdf-fallback a {
            font-weight: 600;
        }

        /* Footer */

        footer {
            margin-top: 70px;
            padding: 24px 28px;
            border-top: 1px solid var(--border);
            color: #7a8491;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .nav-container {
                padding: 14px 20px;
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 18px;
            }

            main {
                padding: 42px 20px 30px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .pdf-frame {
                height: 75vh;
                min-height: 450px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Hari Bhavsar</a>

            <ul class="nav-links">
                <li><a href="teaching.html">Teaching</a></li>
                <li><a href="cv.html" aria-current="page">CV</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <div>
                <h1>Curriculum Vitae</h1>
                <p>Academic background, research experience, and publications.</p>
            </div>

            <div class="cv-actions">
                <a class="cv-button primary"
                   href="resume.pdf"
                   target="_blank"
                   rel="noopener noreferrer">
                    <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                    Open PDF
                </a>

                <a class="cv-button"
                   href="resume.pdf"
                   download>
                    <i class="fas fa-download" aria-hidden="true"></i>
                    Download CV
                </a>
            </div>
        </header>

        <section aria-label="Embedded curriculum vitae">
            <div class="pdf-frame">
                <iframe
                    src="resume.pdf"
                    title="Hari Bhavsar Curriculum Vitae"
                    loading="lazy">
                    <div class="pdf-fallback">
                        Your browser does not support embedded PDFs.
                        <a href="resume.pdf" target="_blank" rel="noopener noreferrer">
                            Open the CV PDF
                        </a>.
                    </div>
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hari Bhavsar</p>
    </footer>

</body>
</html>
```
